<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Runsheet">
<meta name="description" content="Plan your GTA VI session, track collectibles and route what's left. Unofficial fan guide.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Runsheet · Unofficial GTA VI companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="loader" role="status" aria-label="Runsheet is loading">
  <div class="ld-mark">
    <svg id="ld-land" viewBox="0 0 300 300" aria-hidden="true">
      <defs>
        <linearGradient id="ld-sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC46B"/><stop offset=".35" stop-color="#FF8A2B"/><stop offset=".7" stop-color="#E8590C"/><stop offset="1" stop-color="#B8380A"/></linearGradient>
        <clipPath id="ld-rise"><rect class="ld-rise" x="0" y="0" width="300" height="300"/></clipPath>
      </defs>
      <g class="ld-filled" clip-path="url(#ld-rise)">
        <path class="ld-edge"/><path fill="url(#ld-sun)"/><path class="ld-rim"/>
      </g>
      <path class="ld-trace" pathLength="1"/>
    </svg>
    <svg class="ld-route" viewBox="0 0 460 360" aria-hidden="true">
      <g clip-path="url(#ld-rise2)"><defs><clipPath id="ld-rise2"><rect class="ld-rise" x="0" y="0" width="460" height="360"/></clipPath></defs>
        <path class="ld-r-under" d="M60,300 C120,250 110,190 170,170 S260,200 290,140 S330,60 400,50"/>
        <path class="ld-r-top" d="M60,300 C120,250 110,190 170,170 S260,200 290,140 S330,60 400,50"/></g>
      <path class="ld-r-trace" pathLength="1" d="M60,300 C120,250 110,190 170,170 S260,200 290,140 S330,60 400,50"/>
    </svg>
  </div>
  <div class="ld-name">RUNSHEET</div>
  <div class="ld-pct">LOADING 0%</div>
  <p class="ld-foot">Fan made. Not affiliated with Rockstar Games or Take-Two Interactive.</p>
</div>
<script src="loader.js"></script>
<div id="app">
  <main id="view" aria-live="polite"></main>
  <div id="sheet-root"></div>
  <nav id="tabs" class="glass" aria-label="Main">
    <a href="#plan" data-tab="plan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="6" r="2.2"/><path d="M8 18h5a3.5 3.5 0 0 0 0-7h-2a3.5 3.5 0 0 1 0-7h5"/></svg>
      <span>Plan</span></a>
    <a href="#map" data-tab="map">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5 9 4l6 2.5L21 4v13.5L15 20l-6-2.5L3 20z"/><path d="M9 4v13.5M15 6.5V20"/></svg>
      <span>Map</span></a>
    <a href="#guide" data-tab="guide">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h6a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h6z"/></svg>
      <span>Guide</span></a>
    <a href="#checklist" data-tab="checklist">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 7 2 2 3.5-3.5M4 14l2 2 3.5-3.5M13 8h7M13 15h7"/></svg>
      <span>Checklist</span></a>
  </nav>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="route.js"></script>
<script src="app.js"></script>
<script>if ('serviceWorker' in navigator && location.hostname !== 'localhost') {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  // a new version took over: reload once so the page shows it (not on the very first install)
  const had = !!navigator.serviceWorker.controller; let done = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !done) { done = true; location.reload(); } });
}</script>
</body>
</html>
